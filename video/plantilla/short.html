<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#12141d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Plantilla de Short vertical 9:16 sobre el mapa de secciones de Cataluña.
// El guion sale de shorts/<nombre>.json (?c=<nombre>). Cada fotograma se dibuja con render(t), t en segundos.
// Tiempos (escala de 30 s, se reproducen a SPEED): gancho 0-9,6 · mapa y región 10-18,3 · foco y bloque final 18,8-26,2 · cierre 26,5-30.
const W = 1080, H = 1920, SPEED = 1.3, DUR = 30 / SPEED;  // los tiempos del guion están en escala de 30 s
const C = {bg:'#12141d', fg:'#e8eaf2', muted:'#9aa0b8', rule:'#2c3042', vote:'#7d8ce8', noright:'#e0a440', abst:'#c77da3', empty:'#2a2e3e'};
const F = {display:'"Bricolage Grotesque"', body:'"Newsreader"', mono:'"IBM Plex Mono"'};
const K_LAT = Math.cos(41.7 * Math.PI / 180);   // misma proyección que prep_geo.py
const ctx = document.getElementById('c').getContext('2d');
let S = [], MUN = {}, SEC = {}, BOX, G;
// Favicon del sitio (copia de /favicon.svg) para el cierre
const LOGO = new Image();
LOGO.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#fff"/><g stroke="#fff" stroke-width="3"><path d="M4 4h30v26H4z" fill="#e30613" transform="translate(0 0)"/><path d="M34 4h26v20H34z" fill="#1d84ce"/><path d="M4 30h22v30H4z" fill="#1d84ce"/><path d="M26 30h8v-6h26v20H26z" fill="#e30613"/><path d="M26 44h34v16H26z" fill="#6b2c91"/></g></svg>');

const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const col = c => C[c] || c;
function mix(c1, c2, k) {
  const p = c => [1,3,5].map(i => parseInt(c.slice(i, i+2), 16));
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',') + ')';
}
// Escala divergente alrededor de la media: por debajo, color de abstención; por encima, color de voto
function colour(v) {
  if (v == null) return C.empty;
  const d = (v - G.metric.mean) / G.metric.spread;
  return d < 0 ? mix('#3a3550', C.abst, clamp(-d)) : mix('#3a3550', C.vote, clamp(d));
}
const fmt = (v, d=0) => (v * 100).toFixed(d).replace('.', ',');

async function load() {
  const name = new URLSearchParams(location.search).get('c');
  G = await (await fetch('../shorts/' + name + '.json')).json();
  S = await (await fetch('../comun/secciones.json')).json();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of S) {
    let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
    for (const r of s.r) for (let i = 0; i < r.length; i += 2) {
      a = Math.min(a, r[i]); c = Math.max(c, r[i]); b = Math.min(b, r[i+1]); d = Math.max(d, r[i+1]);
    }
    s.cx = (a + c) / 2; s.cy = (b + d) / 2;
    s.o = Math.abs((Math.sin(s.cx * 913.1 + s.cy * 377.7) * 43758.5453) % 1);
    s.val = s[G.metric.field];
    x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d);
    const m = MUN[s.m] || (MUN[s.m] = {x: 0, y: 0, n: 0});
    m.x += s.cx; m.y += s.cy; m.n++;
    SEC[s.c] = {x: s.cx, y: s.cy};
  }
  for (const k in MUN) { MUN[k].x /= MUN[k].n; MUN[k].y /= MUN[k].n; }
  BOX = {x0, y0, x1, y1};
  await document.fonts.load('800 40px ' + F.display);
  await document.fonts.load('400 40px ' + F.body);
  await document.fonts.load('500 40px ' + F.mono);
  await document.fonts.ready;
  await LOGO.decode();
}

// Un punto del guion: "mun:Salt", "sec:1706601005" o [lon, lat]
function pt(ref) {
  if (Array.isArray(ref)) return {x: ref[0] * K_LAT, y: -ref[1]};
  const [k, v] = ref.split(':');
  return k === 'mun' ? MUN[v] : SEC[v];
}
function cams() {
  const cat = {x: (BOX.x0 + BOX.x1)/2, y: (BOX.y0 + BOX.y1)/2 + 0.25, w: (BOX.x1 - BOX.x0) * 1.08};
  const wide = {x: cat.x, y: cat.y, w: cat.w * 1.25};
  const r = pt(G.region.at), f = G.focus ? pt(G.focus.at) : r;
  const region = {x: r.x + (G.region.dx || 0), y: r.y + (G.region.dy || 0), w: G.region.w};
  const focus = G.focus ? {x: f.x + (G.focus.dx || 0), y: f.y + (G.focus.dy || 0), w: G.focus.w} : region;
  return {cat, wide, region, focus};
}
function camAt(t) {
  const K = cams();
  const blend = (a, b, k) => ({x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: Math.exp(lerp(Math.log(a.w), Math.log(b.w), k))});
  // en cada plano fijo la cámara sigue acercándose despacio
  const drift = (c, k) => ({x: c.x, y: c.y, w: c.w * (1 - 0.1 * clamp(k))});
  if (t < 10) return drift(K.cat, t / 10);
  if (t < 11.5) return blend(drift(K.cat, 1), K.wide, seg(t, 10, 11.5));     // primero se aleja
  if (t < 15) return blend(K.wide, K.region, seg(t, 11.5, 15));               // luego desciende
  if (t < 18.5) return drift(K.region, (t - 15) / 3.5);
  if (t < 21) return blend(drift(K.region, 1), K.focus, seg(t, 18.5, 21));
  return drift(K.focus, (t - 21) / 6);
}
function isFocus(s) {
  const [k, v] = G.focus.at.split(':');
  return k === 'mun' ? s.m === v : s.c === v;
}

function drawMap(t, mapTop, mapH) {
  const cam = camAt(t);
  const sc = W / cam.w;
  const ox = W/2 - cam.x * sc, oy = mapTop + mapH/2 - cam.y * sc;
  const reveal = seg(t, 1.2, 5);
  const focus = G.focus && t > 18.5 ? seg(t, 18.5, 20) : 0;
  ctx.save();
  ctx.lineJoin = 'round';
  for (const s of S) {
    const sx = s.cx * sc + ox, sy = s.cy * sc + oy;
    if (sx < -400 || sx > W + 400 || sy < mapTop - 400 || sy > mapTop + mapH + 400) continue;
    const vis = clamp(reveal * 1.3 - s.o * 0.3);
    const dim = (focus && !isFocus(s)) ? 1 - 0.75 * focus : 1;
    ctx.globalAlpha = (0.12 + 0.88 * vis) * dim;
    ctx.fillStyle = vis > 0.02 ? colour(s.val) : C.empty;
    ctx.beginPath();
    for (const r of s.r) {
      ctx.moveTo(r[0]*sc + ox, r[1]*sc + oy);
      for (let i = 2; i < r.length; i += 2) ctx.lineTo(r[i]*sc + ox, r[i+1]*sc + oy);
      ctx.closePath();
    }
    ctx.fill();
    if (sc > 3000) { ctx.strokeStyle = 'rgba(18,20,29,.6)'; ctx.lineWidth = sc > 8000 ? 2 : 0.8; ctx.stroke(); }
  }
  ctx.restore();
  return {sc, ox, oy};
}

function text(str, x, y, font, color, align='left', alpha=1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = 'rgba(18,20,29,.85)'; ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillText(str, x, y); ctx.restore();
}
// Una línea es un texto o una lista de tramos [texto, color]
function lines(arr, x, y, size, lh, font, color, alpha0=1, align='left') {
  const f = font.replace('SZ', size + 'px');
  arr.forEach((l, i) => {
    const alpha = ease(alpha0 * 1.6 - i * 0.2);
    if (alpha <= 0) return;
    y += (1 - alpha) * 50;
    if (typeof l === 'string') return text(l, x, y + i*lh, f, color, align, alpha);
    ctx.font = f;
    let cx = align === 'center' ? x - l.reduce((s, p) => s + ctx.measureText(p[0]).width, 0) / 2 : x;
    for (const [s, c] of l) { text(s, cx, y + i*lh, f, col(c), 'left', alpha); ctx.font = f; cx += ctx.measureText(s).width; }
  });
}
const fade = (t, a, b, d=0.5) => clamp(Math.min((t - a)/d, (b - t)/d));

function label(L, i, t, p) {
  const al = fade(t, 14.6 + i * 0.4, 18.5);
  if (al <= 0) return;
  const M = pt(L.at);
  const x = M.x * p.sc + p.ox, y = M.y * p.sc + p.oy, dx = L.dx || 0, dy = L.dy || 0;
  ctx.save(); ctx.globalAlpha = al;
  ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
  ctx.strokeStyle = C.fg; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  ctx.restore();
  const right = L.side !== 'left', tx = x + dx + (right ? 14 : -14), al2 = right ? 'left' : 'right';
  text(L.name, tx, y + dy - 6, '700 46px ' + F.display, C.fg, al2, al);
  text(L.note, tx, y + dy + 42, '500 32px ' + F.mono, L.value < G.metric.mean ? C.abst : C.vote, al2, al);
}

// Bloques finales
function stack(B, t, a, X) {
  const by = 1180;
  let acc = 0;
  B.parts.forEach(([v, c, l], i) => {
    const k = seg(t, 20.5 + i*1.3, 21.7 + i*1.3) * a;
    if (k > 0) {
      ctx.globalAlpha = a; ctx.fillStyle = col(c);
      ctx.fillRect(X + acc * (W - 2*X), by, v * (W - 2*X) * k, 64);
      ctx.globalAlpha = 1;
      text(Math.round(v * 100 * k) + '', X, by + 150 + i*88, '800 70px ' + F.display, col(c), 'left', k);
      text(l, X + 120, by + 140 + i*88, '400 44px ' + F.body, C.fg, 'left', k);
    }
    acc += v;
  });
}
function bars(B, t, a, X) {
  const top = 700, bottom = 1330, n = B.values.length, gap = 14;
  const bw = (W - 2*X - gap * (n - 1)) / n, max = B.max;
  B.values.forEach((v, i) => {
    const k = seg(t, 19.6 + i*0.18, 20.6 + i*0.18) * a;
    if (k <= 0) return;
    const h = (bottom - top) * v / max * k, x = X + i * (bw + gap);
    const c = i === 0 ? C.abst : i === n - 1 ? C.vote : '#4a4f6e';
    ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(x, bottom - h, bw, h); ctx.globalAlpha = 1;
    if (i === 0 || i === n - 1) text(fmt(v * k), x + bw/2, bottom - h - 22, '800 56px ' + F.display, c, 'center', k);
    text(String(i + 1), x + bw/2, bottom + 44, '500 28px ' + F.mono, C.muted, 'center', a);
  });
  text(B.left, X, bottom + 100, '500 28px ' + F.mono, C.abst, 'left', a);
  text(B.right, W - X, bottom + 100, '500 28px ' + F.mono, C.vote, 'right', a);
}
function facts(B, t, a, X) {
  B.items.forEach(([n, c, l], i) => {
    const k = seg(t, 20.3 + i*1.1, 21.3 + i*1.1) * a;
    const y = 1150 + i * 112;
    text(n.replace(/\d+/, d => Math.round(d * k)), X, y + (1 - k) * 40, '800 76px ' + F.display, col(c), 'left', k);

    text(l, X + 250, y - 8 + (1 - k) * 40, '400 42px ' + F.body, C.fg, 'left', k);
  });
}

function render(tReal) {
  const t = tReal * SPEED;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const mapTop = 470, mapH = 930;  // la franja inferior la tapa la interfaz de Shorts
  const p = drawMap(t, mapTop, mapH);
  let g = ctx.createLinearGradient(0, 0, 0, mapTop + 120);
  g.addColorStop(0, C.bg); g.addColorStop(.72, C.bg); g.addColorStop(1, 'rgba(18,20,29,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, mapTop + 120);
  g = ctx.createLinearGradient(0, mapTop + mapH - 160, 0, H);
  g.addColorStop(0, 'rgba(18,20,29,0)'); g.addColorStop(.3, C.bg); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, mapTop + mapH - 160, W, H);

  const X = 72;
  text(G.kicker, X, 150, '500 30px ' + F.mono, C.muted, 'left', fade(t, -1, 26));

  // 1. Gancho
  lines(G.hook, X, 270, 92, 98, '800 SZ ' + F.display, C.fg, fade(t, -1, 9.6));

  // 2. Mapa y región
  lines(G.map.title, X, 260, 72, 84, '800 SZ ' + F.display, C.fg, fade(t, 10, 18.3));
  lines(G.map.sub, X, 420, 40, 50, '400 SZ ' + F.body, C.muted, fade(t, 12.5, 18.3));

  let a = fade(t, 4, 14.2);
  if (a > 0) {
    const lx = X, ly = 1440, lw = W - 2*X, m = G.metric, lo = m.mean - m.spread, hi = m.mean + m.spread;
    for (let i = 0; i < 100; i++) { ctx.globalAlpha = a; ctx.fillStyle = colour(lo + i/99 * (hi - lo)); ctx.fillRect(lx + i*lw/100, ly, lw/100 + 1, 26); }
    ctx.globalAlpha = 1;
    text(m.legend, lx, ly - 22, '500 28px ' + F.mono, C.muted, 'left', a);
    text(fmt(lo) + '%', lx, ly + 66, '500 28px ' + F.mono, C.abst, 'left', a);
    text('media ' + fmt(m.mean) + '%', lx + lw/2, ly + 66, '500 28px ' + F.mono, C.fg, 'center', a);
    text(fmt(hi) + '%', lx + lw, ly + 66, '500 28px ' + F.mono, C.vote, 'right', a);
  }
  (G.labels || []).forEach((L, i) => label(L, i, t, p));

  // 3. Foco y bloque final
  a = fade(t, 18.8, 26.2);
  if (G.final.type === 'bars' && a > 0) { ctx.globalAlpha = a * 0.85; ctx.fillStyle = C.bg; ctx.fillRect(0, 470, W, H); ctx.globalAlpha = 1; }
  lines(G.final.title, X, 260, 72, 84, '800 SZ ' + F.display, C.fg, a);
  if (G.final.note) lines(G.final.note, X, 420, 36, 46, '400 SZ ' + F.body, C.muted, fade(t, 24.2, 26.2));
  ({stack, bars, facts})[G.final.type](G.final, t, a, X);

  // 4. Cierre
  a = fade(t, 26.5, 40);
  if (a > 0) {
    ctx.globalAlpha = a * 0.92; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.globalAlpha = a; ctx.drawImage(LOGO, W/2 - 90, 440, 180, 180); ctx.globalAlpha = 1;
    lines(G.outro, W/2, 760, 96, 104, '800 SZ ' + F.display, C.fg, a, 'center');
    text(G.url || 'mapaelectoral.es', W/2, 1130, '700 64px ' + F.display, C.vote, 'center', a);
    G.source.forEach((s, i) => text(s, W/2, 1420 + i*45, '500 26px ' + F.mono, C.muted, 'center', a));
  }
}
window.DUR = DUR;
window.ready = load().then(() => { render(0); return true; });
window.render = render;
</script>
</body>
</html>
