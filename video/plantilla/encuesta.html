<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#12141d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Short vertical 9:16 de encuesta, sin mapa y con cortes rápidos. Guion en shorts/<nombre>.json (?c=<nombre>).
// Escenas (segundos reales): gancho 0-3 · puntos 3-7,5 · edad 7,5-11,5 · partidos 11,5-15,5 · ideología 15,5-18 · cierre 18-21.
const W = 1080, H = 1920, DUR = 21;
const C = {bg:'#12141d', fg:'#e8eaf2', muted:'#9aa0b8', rule:'#2c3042', vote:'#7d8ce8', empty:'#2a2e3e'};
const F = {display:'"Bricolage Grotesque"', body:'"Newsreader"', mono:'"IBM Plex Mono"'};
const SC = [['hook', 0, 3], ['dots', 3, 7.5], ['edad', 7.5, 11.5], ['partidos', 11.5, 15.5], ['ideologia', 15.5, 18], ['outro', 18, 30]];
const ctx = document.getElementById('c').getContext('2d');
let G;
const LOGO = new Image();
LOGO.src = '../../favicon.svg';

const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };  // con rebote
const col = c => C[c] || c;
const fmt = (v, d=0) => v.toFixed(d).replace('.', ',');

async function load() {
  G = await (await fetch('../shorts/' + new URLSearchParams(location.search).get('c') + '.json')).json();
  await document.fonts.load('800 40px ' + F.display);
  await document.fonts.load('400 40px ' + F.body);
  await document.fonts.load('500 40px ' + F.mono);
  await document.fonts.ready;
  await LOGO.decode();
}

function text(str, x, y, font, color, align='left', alpha=1, scale=1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(alpha); ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(str, 0, 0); ctx.restore();
}
// Línea a línea, cada una entra de golpe con rebote; una línea es texto o lista de tramos [texto, color]
function pop(arr, x, y, size, lh, t0, t, step=0.18, align='left') {
  const f = '800 ' + size + 'px ' + F.display;
  arr.forEach((l, i) => {
    const k = (t - t0 - i * step) / 0.35;
    if (k <= 0) return;
    const s = back(k), a = clamp(k * 3);
    ctx.save(); ctx.font = f;
    const parts = typeof l === 'string' ? [[l, C.fg]] : l;
    const wTot = parts.reduce((s, p) => s + ctx.measureText(p[0]).width, 0);
    const ox = align === 'center' ? x - wTot / 2 : x;
    ctx.translate(ox + (align === 'center' ? wTot / 2 : 0), y + i * lh); ctx.scale(s, s);
    let cx = align === 'center' ? -wTot / 2 : 0;
    for (const [str, c] of parts) { text(str, cx, 0, f, col(c), 'left', a); cx += ctx.measureText(str).width; }
    ctx.restore();
  });
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, Math.max(w, 0.1), h, Math.min(r, w / 2)); ctx.fill();
}

// Fondo que se mueve despacio todo el rato
function backdrop(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const blobs = [[0.2, 0.25, '#5ac035', 0.07], [0.85, 0.6, '#a2275f', 0.09], [0.3, 0.85, '#7d8ce8', 0.06]];
  blobs.forEach(([bx, by, c, a], i) => {
    const x = W * (bx + 0.08 * Math.sin(t * 0.7 + i * 2)), y = H * (by + 0.05 * Math.cos(t * 0.5 + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 700);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(18,20,29,0)');
    ctx.globalAlpha = a * 4; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  });
}

const X = 72;
const S = {
  hook(t) {
    pop(G.hook, X, 640, 120, 140, 0.15, t, 0.32);
  },
  dots(t) {
    const D = G.dots;
    text(D.title, X, 330, '500 34px ' + F.mono, C.muted, 'left', ease(t / 0.3));
    D.groups.forEach(([name, n], gi) => {
      const top = 440 + gi * 540, size = 40, gap = 10, left = W - X - 10 * (size + gap) + gap;
      pop([name], X, top + 60, 60, 0, 0.1 + gi * 0.25, t);
      const cnt = Math.round(n * ease((t - 1.6 - gi * 0.3) / 1.4));
      text(String(cnt), X, top + 250, '800 140px ' + F.display, D.color, 'left', clamp((t - 1.5 - gi * 0.3) * 4));
      text('a ' + D.party, X + 8, top + 310, '500 30px ' + F.mono, D.color, 'left', clamp((t - 1.5 - gi * 0.3) * 4));
      for (let i = 0; i < 100; i++) {
        const r = Math.floor(i / 10), c = i % 10;
        const appear = clamp((t - 0.3 - gi * 0.25 - (r + c) * 0.025) / 0.2);
        if (appear <= 0) continue;
        const on = i < cnt;  // los puntos se encienden al ritmo del contador
        const s = appear * (on && i === cnt - 1 && cnt < n ? 1.3 : 1);
        ctx.fillStyle = on ? D.color : '#3a3f58';
        ctx.beginPath(); ctx.arc(left + c * (size + gap) + size / 2, top + r * (size + gap) + size / 2, size / 2 * s, 0, 7); ctx.fill();
      }
    });
  },
  edad(t) {
    const E = G.edad;
    pop(E.title, X, 300, 84, 96, 0, t);
    text(E.sub, X, 470, '500 30px ' + F.mono, C.muted, 'left', ease((t - 0.3) / 0.3));
    legend(X, 540, E.color, t);
    const max = 20, lw = W - 2 * X - 170;
    E.rows.forEach(([g, h, m], i) => {
      const y = 700 + i * 220, k = ease((t - 0.5 - i * 0.18) / 0.7);
      text(g, X, y + 62, '700 44px ' + F.display, i === 0 ? C.fg : C.muted, 'left', k * 3);
      [[h, 0.45], [m, 1]].forEach(([v, a], j) => {
        ctx.globalAlpha = a; ctx.fillStyle = E.color; rrect(X + 170, y + j * 66, lw * v / max * k, 54, 8); ctx.globalAlpha = 1;
        text(fmt(v * k) + '%', X + 170 + lw * v / max * k + 16, y + j * 66 + 42, '500 34px ' + F.mono, C.fg, 'left', k);
      });
    });
    const k = ease((t - 2.2) / 0.4);
    text('×3', W - X, 400, '800 120px ' + F.display, E.color, 'right', k, back((t - 2.2) / 0.4));
  },
  partidos(t) {
    const P = G.partidos;
    pop(P.title, X, 300, 84, 96, 0, t);
    text(P.sub, X, 470, '500 30px ' + F.mono, C.muted, 'left', ease((t - 0.3) / 0.3));
    legend(X, 540, C.fg, t);
    const max = 40, lw = W - 2 * X - 200;
    P.rows.forEach(([p, c, h, m], i) => {
      const y = 700 + i * 220, k = ease((t - 0.5 - i * 0.18) / 0.7);
      text(p, X, y + 62, '700 48px ' + F.display, c, 'left', k * 3);
      [[h, 0.45], [m, 1]].forEach(([v, a], j) => {
        ctx.globalAlpha = a; ctx.fillStyle = c; rrect(X + 200, y + j * 66, lw * v / max * k, 54, 8); ctx.globalAlpha = 1;
        text(fmt(v * k) + '%', X + 200 + lw * v / max * k + 16, y + j * 66 + 42, '500 34px ' + F.mono, C.fg, 'left', k);
      });
    });
  },
  ideologia(t) {
    const I = G.ideologia;
    pop(I.title, X, 300, 84, 96, 0, t);
    text(I.sub, X, 470, '500 28px ' + F.mono, C.muted, 'left', ease((t - 0.3) / 0.3));
    const y = 1000, x0 = X + 20, x1 = W - X - 20, px = v => x0 + (x1 - x0) * (v - 1) / 9;
    const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#e30613'); g.addColorStop(1, '#1d84ce');
    ctx.globalAlpha = ease(t / 0.4); ctx.fillStyle = g; rrect(x0, y - 6, x1 - x0, 12, 6); ctx.globalAlpha = 1;
    for (let v = 1; v <= 10; v++) text(String(v), px(v), y + 60, '500 30px ' + F.mono, C.muted, 'center', ease(t / 0.4));
    [['Ellas', I.m, 1, -1], ['Ellos', I.h, 0.6, 1]].forEach(([l, v, a, side], i) => {
      const k = ease((t - 0.4 - i * 0.25) / 0.8), x = side < 0 ? px(1) + (px(v) - px(1)) * k : px(10) + (px(v) - px(10)) * k;
      ctx.globalAlpha = clamp(k * 3) * a; ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      const ly = y + (side < 0 ? -90 : 170);
      text(l, x, ly, '800 56px ' + F.display, C.fg, 'center', clamp(k * 3) * (a === 1 ? 1 : 0.8));
      text(fmt(v * Math.min(1, k + 0.0001), 1), x, ly + (side < 0 ? -66 : 56), '500 40px ' + F.mono, C.fg, 'center', clamp(k * 3));
    });
  },
  outro(t) {
    const k = back(t / 0.4);
    ctx.save(); ctx.translate(W / 2, 530); ctx.scale(k, k); ctx.globalAlpha = clamp(t * 4); ctx.drawImage(LOGO, -90, -90, 180, 180); ctx.restore();
    pop(G.outro, W / 2, 760, 96, 104, 0.15, t, 0.15, 'center');
    text(G.url || 'mapaelectoral.es', W / 2, 1130, '700 64px ' + F.display, C.vote, 'center', ease((t - 0.6) / 0.3));
    G.source.forEach((s, i) => text(s, W / 2, 1300 + i * 44, '500 26px ' + F.mono, C.muted, 'center', ease((t - 0.8) / 0.3)));
  },
};
function legend(x, y, c, t) {
  const a = ease((t - 0.4) / 0.3);
  ctx.globalAlpha = a * 0.45; ctx.fillStyle = c; rrect(x, y - 26, 34, 30, 6);
  ctx.globalAlpha = a; rrect(x + 230, y - 26, 34, 30, 6); ctx.globalAlpha = 1;
  text('Hombres', x + 48, y, '500 30px ' + F.mono, C.fg, 'left', a);
  text('Mujeres', x + 278, y, '500 30px ' + F.mono, C.fg, 'left', a);
}

function render(t) {
  backdrop(t);
  text(G.kicker, X, 150, '500 30px ' + F.mono, C.muted, 'left', t < 18 ? 1 : 0);
  for (const [name, a, b] of SC) {
    if (t < a || t >= b) continue;
    const lt = t - a, out = b - t;
    // entrada en barrido rápido desde la derecha y salida hacia la izquierda
    const dx = (1 - ease(lt / 0.25)) * 220 - (out < 0.2 ? (1 - out / 0.2) * 120 : 0);
    ctx.save(); ctx.translate(dx, 0);
    S[name](lt);
    ctx.restore();
    if (out < 0.2) { ctx.globalAlpha = 0.85 * (1 - out / 0.2); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (lt < 0.08 && a > 0) { ctx.globalAlpha = 0.25 * (1 - lt / 0.08); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }
}
window.DUR = DUR;
window.ready = load().then(() => { render(0); return true; });
window.render = render;
</script>
</body>
</html>
