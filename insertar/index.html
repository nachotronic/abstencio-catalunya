<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa electoral de España por municipio y sección censal</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://mapaelectoral.es/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#faf8f3; --surface:#ffffff; --ink:#1a1a1a; --ink2:#444; --muted:#767676; --line:#e3dfd6;
  --map-bg:#f4f1ea; --map-line:#ffffff; --nodata:#d9d6cf; --accent:#b3261e;
  --serif:'Newsreader',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2025; --ink:#ecebe7; --ink2:#c4c2bc; --muted:#9a988f; --line:#33363d;
    --map-bg:#25272d; --map-line:#15161a; --nodata:#3a3c42; --accent:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2025; --ink:#ecebe7; --ink2:#c4c2bc; --muted:#9a988f; --line:#33363d;
  --map-bg:#25272d; --map-line:#15161a; --nodata:#3a3c42; --accent:#ff8a80;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
.col{max-width:680px;margin:0 auto;padding:0 16px}
.wide{max-width:1240px;margin:0 auto;padding:0 16px}
header{padding:48px 0 8px}
.kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--sans);font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.015em;margin:10px 0 16px}
.lede{font-size:21px;color:var(--ink2)}
.byline{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:14px}
h2{font-family:var(--sans);font-size:26px;line-height:1.2;margin:56px 0 12px}
.num{font-family:var(--mono);font-size:.9em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:28px 0;font-family:var(--sans)}
.stat{border-top:3px solid var(--c,var(--ink));padding-top:8px}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
/* mapa */
#mapa{margin-top:28px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;font-family:var(--sans);font-size:13px;padding:12px 0}
.controls label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-weight:500}
.controls select,.controls input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:150px;max-width:100%}
.controls input{min-width:220px}
.controls button{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
.mapwrap{position:relative;height:min(78vh,760px);min-height:440px;background:var(--map-bg);border-radius:8px;overflow:hidden}
#map{position:absolute;inset:0}
#legend{position:absolute;right:12px;bottom:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:12px;max-width:min(330px,calc(100% - 24px));z-index:2}
.lg-t{font-weight:600;margin-bottom:6px}
.lg-sw{display:flex;flex-wrap:wrap;gap:4px 10px}
.lg-sw b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lg-n{color:var(--muted);margin-top:4px}
.lg-n .nd{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg-g{height:10px;border-radius:2px;width:240px;max-width:100%}
.lg-x{display:flex;justify-content:space-between;color:var(--muted);margin-top:3px;gap:12px}
#tip{position:absolute;z-index:3;width:290px;max-width:calc(100% - 16px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.14);pointer-events:none}
.t-h{font-weight:700;font-size:15px}
.t-s{color:var(--muted);font-size:12px;margin-bottom:6px}
.t-bars{width:100%;border-collapse:collapse}
.t-bars th{text-align:left;font-weight:500;white-space:nowrap;padding:1px 6px 1px 0;width:1%}
.t-bars td{padding:1px 0}
.t-bars .bar{display:block;height:9px;border-radius:0 3px 3px 0}
.t-bars .n{text-align:right;font-family:var(--mono);font-size:12px;width:52px}
.t-kv{display:grid;grid-template-columns:auto auto;gap:1px 10px;margin:8px 0 0;border-top:1px solid var(--line);padding-top:6px}
.t-kv dt{color:var(--muted)} .t-kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px}
.t-na{color:var(--muted);margin:4px 0}
@media (max-width:760px){#insertar{display:none}}   /* en el móvil, el mapa manda: insertar es cosa del escritorio */
.insertar{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;margin:8px 0}
.insertar p{margin:0 0 8px;color:var(--ink2)}
.insertar textarea{width:100%;font:12px/1.45 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.insertar button{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;margin-top:6px}
.hint{font-family:var(--sans);font-size:13px;color:var(--muted);margin:8px 0 0}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:var(--sans);color:var(--muted)}
/* directo */
.directo{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;margin:6px 0 4px}
.d-top{color:var(--muted)} .d-top b{color:var(--ink);font-family:var(--mono)}
.d-live{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 6px;margin-right:4px}
.d-seats{position:relative;display:flex;gap:2px;height:22px;margin:26px 0 4px}
.d-seats span{display:block;height:100%}
.d-seats span:first-child{border-radius:4px 0 0 4px} .d-seats span:last-child{border-radius:0 4px 4px 0}
.d-seats i{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}
.d-seats em{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted)}
.d-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.d-leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.d-leg .n{font-family:var(--mono);font-weight:600}
/* gráficos */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 32px;margin:24px 0}
.chartcard h3{font-family:var(--sans);font-size:16px;margin:0 0 2px}
.chartcard p.sub{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.chart .lbl{font-family:var(--sans);font-size:11px;fill:var(--ink2);font-weight:500}
.chart .xh{stroke:var(--muted);stroke-dasharray:2 3}
.chart .hit{fill:transparent;cursor:crosshair}
.ctip{position:absolute;top:0;width:170px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--sans);font-size:12px;line-height:1.45;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.mut{color:var(--muted)}
details.tabla{font-family:var(--sans);font-size:13px;margin:6px 0}
details.tabla summary{cursor:pointer;color:var(--muted)}
details.tabla table{border-collapse:collapse;width:100%;margin-top:6px;font-variant-numeric:tabular-nums}
details.tabla caption{text-align:left;color:var(--muted);padding-bottom:4px}
details.tabla th,details.tabla td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
details.tabla th:nth-child(2),details.tabla td:nth-child(2){text-align:left}
figure.fig{margin:28px 0}
figure.fig figcaption{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
figure.fig h3{font-family:var(--sans);font-size:16px;margin:0 0 8px}
svg.brecha{width:100%;max-width:560px;height:auto;display:block}
svg.brecha{--pobre:#d98a2b;--rico:#5b3f99}
:root[data-theme="dark"] svg.brecha{--pobre:#c27a26;--rico:#8f74d4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) svg.brecha{--pobre:#c27a26;--rico:#8f74d4}}
svg.brecha .ax,svg.brecha .lg{font-family:var(--sans);font-size:13px;fill:var(--ink2)}
svg.brecha .val,svg.brecha .tk{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.brecha .gap{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
svg.brecha .gh{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--muted);text-transform:uppercase;letter-spacing:.04em}
svg.brecha .grid{stroke:var(--line);stroke-width:1}
svg.brecha .cn{stroke:var(--muted);stroke-width:2;stroke-opacity:.45}
svg.brecha .d1{fill:var(--pobre);stroke:var(--surface);stroke-width:2}
svg.brecha .d10{fill:var(--rico);stroke:var(--surface);stroke-width:2}
svg.brecha .hit{fill:transparent}
svg.brecha g:hover .hit{fill:var(--line);fill-opacity:.5}
blockquote.cita{margin:22px 0;padding:2px 0 2px 18px;border-left:3px solid var(--accent)}
blockquote.cita p{margin:0 0 6px;font-style:italic}
blockquote.cita footer,blockquote.cita cite{font-family:var(--sans);font-size:13px;font-style:normal;color:var(--muted);border:0;margin:0;padding:0}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:22px 0 4px}
.atlas{display:grid;align-content:start;gap:4px;margin:0;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--surface);font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--ink2);text-decoration:none}
.atlas b{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink)}
.atlas-k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.atlas-go{font-weight:600;color:var(--accent);margin-top:2px}
.atlas:hover{border-color:var(--accent)} .atlas:hover .atlas-go{text-decoration:underline}
.compara{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink2);margin-top:14px}
.limites ul,.corr{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink2);padding-left:20px}
.limites li,.corr li{margin:4px 0}
.go{font-family:var(--sans);font-size:.85em;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
footer{border-top:1px solid var(--line);margin-top:64px;padding:24px 0 48px;font-family:var(--sans);font-size:14px;color:var(--muted)}
footer a{color:var(--ink2)}
@media (max-width:760px){
  body{font-size:18px}
  .lede{font-size:19px}
  .controls select,.controls input{min-width:0;width:100%}
  .controls label{flex:1 1 45%}
  .controls label.q{flex-basis:100%}
  .mapwrap{height:70vh}
  #tip{width:auto;left:8px!important;right:8px}
}
.del-atlas{margin-top:22px;margin-bottom:8px}
.del-atlas .da-cab{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:10px}
.del-atlas h2{font:700 13px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;margin:0}
.del-atlas h2 a{color:var(--ink);text-decoration:none}
.da-nav button{font:600 16px/1 var(--sans);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;margin-left:6px}
.da-nav button:hover{border-color:var(--accent);color:var(--accent)}
.carrusel{list-style:none;margin:0;padding:0 0 8px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,calc((100% - 48px)/4.3));gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.carrusel li{scroll-snap-align:start}
.carrusel a{display:flex;flex-direction:column;gap:4px;height:100%;color:var(--ink);text-decoration:none;font-family:var(--sans)}
.carrusel img,.carrusel .sinfoto{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;background:var(--line);margin-bottom:6px}
.carrusel .sinfoto{display:flex;align-items:flex-end;padding:10px 12px;box-sizing:border-box;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.carrusel .atlas-k{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.carrusel b{font-size:17px;line-height:1.22}
.carrusel a:hover b{text-decoration:underline}
.carrusel li.todas a{justify-content:center;padding:16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--surface)}
.carrusel li.todas span{color:var(--ink2);font-size:14px}
@media (max-width:760px){.carrusel{grid-auto-columns:72%}.da-nav{display:none}}
nav.site a.marca{color:var(--ink);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;margin-right:4px}
nav.site{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line);font:500 14px/1.4 var(--sans)}nav.site a{color:var(--ink2);text-decoration:none}nav.site a:hover{color:var(--accent)}nav.site a[aria-current]{color:var(--ink);font-weight:700}
</style>
<style id="insertable">
html,body{height:100%}
body{margin:0;font-size:16px}
.marco{display:flex;flex-direction:column;height:100svh;padding:0 10px}
#mapa{margin:0;flex:1;display:flex;flex-direction:column;min-height:0}
#mapa .controls{padding:8px 0;gap:6px 8px;font-size:12px}
#mapa .controls label{flex:1 1 28%;gap:2px}
#mapa .controls select,#mapa .controls input{font-size:14px;padding:5px 7px;min-width:0;width:100%}
#mapa .controls button{font-size:13px;padding:6px 10px}
#mapa .mapwrap{flex:1;height:auto;min-height:240px;max-height:none}
/* Canarias va abajo a la derecha: la leyenda, arriba (y en pantalla estrecha, debajo del mapa) */
#mapa #legend{top:12px;bottom:auto}
.firma{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:13px/1.3 var(--sans);color:var(--muted);padding:6px 0 8px}
.firma a{color:var(--ink);font-weight:600}
/* En directo: recuadro compacto (escaños en una línea que se desliza) para que al mapa le quede sitio en un iframe de 620 px */
#directo{padding:6px 10px;margin:4px 0 0;font-size:12px}
#directo .d-seats{height:14px;margin:18px 0 2px}
#directo .d-leg{flex-wrap:nowrap;overflow-x:auto;gap:4px 12px;margin-top:6px;white-space:nowrap;scrollbar-width:thin;padding-bottom:2px}
@media (max-width:760px){
  #mapa .controls label{flex:1 1 40%}
  #mapa .controls label.q{flex:1 1 55%}
  #mapa .mapwrap{height:auto}
  #mapa .mapwrap{display:flex;flex-direction:column;background:none;border-radius:0}
  #mapa #map{position:relative;flex:1;min-height:200px;background:var(--map-bg);border-radius:8px}
  #mapa #legend{position:static;margin:6px 0 0;max-width:none;padding:6px 8px}
}
</style>

</head>
<body>
<div class="marco">
<section id="mapa" aria-label="Mapa electoral">
  <div class="directo" id="directo" hidden aria-live="polite">
    <div class="d-top"><span class="d-live">En directo</span> <span id="d-nombre"></span> · Escrutado <b id="d-esc">–</b> · <span id="d-estado"></span></div>
    <div class="d-seats" id="d-seats"></div>
    <div class="d-leg" id="d-leg"></div>
  </div>
  <div class="controls">
    <label>Qué ver <select id="sel-var"></select></label>
    <label hidden>Partido <select id="sel-party"></select></label>
    <label>Elección <select id="sel-elec"></select></label>
    <label class="q">Buscar municipio <input id="q" list="munlist" placeholder="Escribe un municipio" autocomplete="off"><datalist id="munlist"></datalist></label>
    <button type="button" id="home">Ver toda España</button>
  </div>
  <div class="mapwrap">
    <div id="map" role="img" aria-label="Mapa de España por municipios y secciones censales con el resultado de las elecciones generales"></div>
    <div id="legend"></div>
    <div id="tip" hidden></div>
    <div class="fallback" id="fallback" hidden>No se ha podido cargar el mapa. Las cifras y tablas de esta página recogen los mismos datos.</div>
  </div>
</section>
<p class="firma"><span>Datos: Ministerio del Interior e INE · CC BY 4.0</span><a id="firma" href="https://mapaelectoral.es/" target="_blank" rel="noopener">Mapa Electoral · Nacho G. del Álamo ↗</a></p>
</div>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<script src="../generales-2026/app.js"></script>
<script>document.getElementById('firma').href = 'https://mapaelectoral.es/' + location.search;</script>
</body>
</html>
