# Temporal, solo lectura: audiencia de /encuestas/ 17-11. No se fusiona a main.
name: Audiencia encuestas 17-11
on:
  push:
    branches: [claude/project-thread-18uquf]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-encuestas17.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/encuestas17.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc17.py
