# Temporal, solo lectura: audiencia 20-11. No se fusiona a main.
name: Audiencia viernes 20-11
on:
  push:
    branches: [claude/project-thread-mf5ljw]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-vie20.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/vie20.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc20.py
