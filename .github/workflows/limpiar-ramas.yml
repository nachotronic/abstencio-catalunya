# Borra las ramas listadas en limpieza/ramas-a-borrar.txt, solo si siguen en el commit anotado.
# Se lanza al fusionar en main un cambio en esa lista, o a mano desde Actions.
name: Limpiar ramas
on:
  push:
    branches: [main]
    paths: ['limpieza/ramas-a-borrar.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar ramas integradas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          borradas=0; saltadas=0
          while read -r rama sha; do
            case "$rama" in ''|'#'*|main) continue;; esac
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$rama" --jq .object.sha 2>/dev/null || true)
            if [ -z "$actual" ]; then continue; fi
            if [ "$actual" != "$sha" ]; then echo "Saltada (tiene commits nuevos): $rama"; saltadas=$((saltadas+1)); continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$rama" && borradas=$((borradas+1))
          done < limpieza/ramas-a-borrar.txt
          echo "Borradas: $borradas · Saltadas: $saltadas"
