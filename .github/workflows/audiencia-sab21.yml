# Temporal, solo lectura: audiencia 21-11. No se fusiona a main.
name: Audiencia sábado 21-11
on:
  push:
    branches: [claude/project-thread-k4bara]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-sab21.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/sab21.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc21.py
