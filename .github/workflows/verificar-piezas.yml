# Comprobación automática de las piezas de Actualidad e Internacional en cada PR (regla de Nacho, 3-11-2026):
# las cifras del texto cuadran con los datos de la pieza, no hay enlaces rotos ni imágenes ausentes y las
# piezas internacionales no llevan datos españoles. Si falla, el PR queda en rojo y no se fusiona.
# Qué comprueba y cómo declarar las cifras: actualidad/verificacion/LEEME.md
name: Verificar piezas
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar las piezas que cambia el PR
        run: |
          git fetch -q origin "${{ github.base_ref || 'main' }}"
          python3 src/verificar_piezas.py --base "origin/${{ github.base_ref || 'main' }}" --resumen "$GITHUB_STEP_SUMMARY"
