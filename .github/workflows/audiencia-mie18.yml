# Temporal, solo lectura: audiencia 18-11. No se fusiona a main.
name: Audiencia miercoles 18-11
on:
  push:
    branches: [claude/project-thread-g6aazj]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-mie18.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/mie18.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc18.py
