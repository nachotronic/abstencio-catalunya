# Publica las listas del 29N en cuanto el BOE las trae (28-10: presentadas; 3-11: proclamadas). Mira el sumario
# cada 10 minutos la noche anterior y la mañana; automatico.py no hace nada otros días ni si ya están publicadas.
# Si los datos no cuadran (faltan provincias o listas incompletas), no publica y el job queda en rojo para revisarlo.
name: Listas del 29N
on:
  schedule:
    - cron: '3-59/10 22-23 27 10 *'
    - cron: '3-59/10 0-11 28 10 *'
    - cron: '3-59/10 22-23 2 11 *'
    - cron: '3-59/10 0-11 3 11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listas
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: pip install --quiet pillow
      - name: Leer el BOE y rehacer la sección
        id: listas
        run: python3 listas-electorales-29n/src/automatico.py
      - name: Datos que no cuadran
        if: steps.listas.outputs.revisar == '1'
        run: exit 1
      - name: Commit
        if: steps.listas.outputs.publicar == '1'
        run: |
          git add listas-electorales-29n img/compartir/listas-electorales-29n.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Listas del 29N: candidaturas del BOE $(TZ=Europe/Madrid date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 10; done
      - name: Avisar a IndexNow
        if: steps.listas.outputs.publicar == '1'
        continue-on-error: true
        run: |
          sleep 120
          python3 src/indexnow.py listas-electorales-29n/index.html listas-electorales-29n/*/index.html
