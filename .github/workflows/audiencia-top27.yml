# Temporal, solo lectura: audiencia 27-11. No se fusiona a main.
name: Audiencia 27-11 top
on:
  push:
    branches: [claude/project-thread-eigknp]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-vie27.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/top27.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc27.py
