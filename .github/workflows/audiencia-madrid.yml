name: Audiencia Madrid (consulta puntual)
on:
  push:
    branches: [claude/project-thread-8kgpp6]
    paths: ['.github/workflows/audiencia-madrid.yml']
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta Cloudflare GraphQL
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, collections
          tok = os.environ.get('CF_TOKEN', '')
          if not tok:
              raise SystemExit('Falta el secreto CLOUDFLARE_API_TOKEN')
          def q(dims, f='2026-10-21', t='2026-11-04'):
              body = {'query': 'query($a:String!,$s:String!,$f:Date!,$t:Date!){viewer{accounts(filter:{accountTag:$a}){rumPageloadEventsAdaptiveGroups(limit:5000,filter:{siteTag:$s,date_geq:$f,date_leq:$t},orderBy:[sum_visits_DESC]){count sum{visits} dimensions{' + dims + '}}}}}',
                      'variables': {'a': 'dee996483598974c337d0777f5ef047c', 's': '532b57a6348a4babba29020993949dd7', 'f': f, 't': t}}
              r = urllib.request.Request('https://api.cloudflare.com/client/v4/graphql', json.dumps(body).encode(),
                                         {'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              d = json.load(urllib.request.urlopen(r))
              if d.get('errors'):
                  raise SystemExit(json.dumps(d['errors']))
              return d['data']['viewer']['accounts'][0]['rumPageloadEventsAdaptiveGroups']
          MAD = ('/municipio/madrid/', '/elecciones/madrid/', '/encuestas/madrid/', '/listas-electorales-29n/madrid/')
          es_mad = lambda p: p.startswith(MAD)
          rows = q('requestPath')
          print('== TOP rutas de Madrid (21-10 a 4-11): visitas | vistas | ruta')
          for x in [r for r in rows if es_mad(r['dimensions']['requestPath'])][:60]:
              print(x['sum']['visits'], x['count'], x['dimensions']['requestPath'])
          tot_m = sum(r['sum']['visits'] for r in rows if r['dimensions']['requestPath'].startswith('/municipio/madrid/'))
          print('== total visitas /municipio/madrid/:', tot_m, ' total sitio:', sum(r['sum']['visits'] for r in rows))
          dias = collections.defaultdict(lambda: [0, 0])
          for r in q('date requestPath'):
              dd = r['dimensions']
              dias[dd['date']][1] += r['sum']['visits']
              if dd['requestPath'].startswith('/municipio/madrid/'):
                  dias[dd['date']][0] += r['sum']['visits']
          print('== por día: fecha | visitas municipio/madrid | visitas sitio')
          for k in sorted(dias):
              print(k, *dias[k])
          ref = collections.Counter()
          for r in q('requestPath refererHost'):
              if es_mad(r['dimensions']['requestPath']):
                  ref[r['dimensions']['refererHost'] or '(directo)'] += r['sum']['visits']
          print('== referers hacia Madrid:', ref.most_common(10))
          PY
