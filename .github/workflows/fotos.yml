name: fotos-candidatas
on:
  push:
    branches: [claude/fotos-candidatas]
    paths: [fetch.py, .github/workflows/fotos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cand4 && git commit -m "Candidatas de Commons" && git push
