# Foto fija del escrutinio del 29N en el HTML (src/foto_29n.py), para los buscadores que no ejecutan JavaScript.
# La noche del 29N, cada 15 minutos de 21:15 a 2:00 (hora de Madrid): cuerpo de la página de resultados y llms.txt.
# No toca title, description, H1, canonical ni URL. Sin directo.url en meta.json, o sin datos reales del 29N, no hace nada.
name: Foto del escrutinio del 29N
on:
  schedule:
    - cron: '15,30,45 20 29 11 *'     # 21:15, 21:30 y 21:45 en Madrid
    - cron: '*/15 21-23 29 11 *'      # 22:00 a 0:45
    - cron: '*/15 0 30 11 *'          # 1:00 a 1:45
    - cron: '0 1 30 11 *'             # 2:00
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: foto29n
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Foto del escrutinio
        run: python3 src/foto_29n.py
      - name: Subir a main
        id: subir
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Foto del escrutinio del 29N (cuerpo de la página de resultados y llms.txt)"
          GITHUB_TOKEN="${{ github.token }}" src/subir_a_main.sh --theirs
          echo "cambio=1" >> "$GITHUB_OUTPUT"
      - name: Avisar a IndexNow (solo a las 21:15, 23:15 y 1:15, no en cada foto)
        if: steps.subir.outputs.cambio == '1'
        continue-on-error: true
        run: |
          H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          if [[ "$H" =~ ^(21|23|01)$ && "$M" -ge 15 && "$M" -lt 30 ]]; then sleep 120; python3 src/indexnow.py elecciones/resultados-elecciones-generales-2026/index.html || true; fi
