# Temporal: audiencia de hoy desde Cloudflare. No se fusiona a main.
name: Audiencia lunes
on:
  push:
    branches: [claude/project-thread-fo2lmv]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-lunes.yml']
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/lunes.py
