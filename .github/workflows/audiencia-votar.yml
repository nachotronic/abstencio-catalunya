name: Audiencia guías de voto (temporal)
on:
  push:
    branches: [claude/project-thread-7c4qle]
    paths: ['.github/audiencia/votar.py', '.github/workflows/audiencia-votar.yml']
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/votar.py
