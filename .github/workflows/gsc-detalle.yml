# Temporal, solo en la rama del hilo. No fusionar.
name: GSC detalle
on:
  push:
    branches: [claude/project-thread-g04hlf]
    paths: [src/gsc_detalle.py]
permissions:
  contents: read
jobs:
  detalle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: src}
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 src/gsc_detalle.py
