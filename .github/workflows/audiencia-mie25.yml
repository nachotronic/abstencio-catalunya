# Temporal, solo lectura: audiencia 25-11. No se fusiona a main.
name: Audiencia miercoles 25-11
on:
  push:
    branches: [claude/project-thread-yiqkrk]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-mie25.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/mie25.py
