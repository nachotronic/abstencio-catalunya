# Descarga las encuestas de generales (Electográfica) y las coteja con Wikipedia una vez al día (07:00 UTC).
# Solo si cambia algún CSV de previsiones/datos/encuestas/: recalcula la estimación del modelo, rehace la página
# /encuestas/, hace commit en main
# y avisa a IndexNow (un push hecho por este workflow no lanza el de IndexNow).
name: Encuestas
on:
  schedule:
    - cron: '7 23 * * *'    # 0:07 en invierno: la fecha de «Actualizado» de la portada cambia al empezar el día (Nacho, 29-10-2026)
    - cron: '17 6 * * *'    # 7:17 en invierno (minuto poco concurrido: GitHub retrasa mucho las tareas en punto)
    - cron: '17 18 * * *'   # 19:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: encuestas
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del modelo
        run: pip install --quiet numpy pandas pillow
      - name: Electográfica
        run: python3 previsiones/src/actualizar_encuestas.py
      - name: Cotejo con Wikipedia
        # si Wikipedia falla o cambia de formato, se guardan igualmente las encuestas de Electográfica
        continue-on-error: true
        run: python3 previsiones/src/cotejar_wikipedia.py
      - name: Commit si hay cambios
        id: commit
        run: |
          # art. 69.7 LOREG: no se publican encuestas nuevas en los cinco días anteriores a la votación del 29N
          d=$(TZ=Europe/Madrid date +%F)
          if [[ "$d" > "2026-11-23" && "$d" < "2026-11-29" ]]; then echo "Veda de encuestas (LOREG 69.7): no se publica"; exit 0; fi
          git add previsiones/datos/encuestas
          nuevas=1
          if git diff --cached --quiet -- '*.csv'; then
            nuevas=0
            # sin encuestas nuevas, la página y la card de portada se rehacen igual una vez al día (Nacho, 28-10-2026),
            # para que la fecha de «Actualizado» sea la de hoy
            if grep -q "datetime=\"$d\"" encuestas/index.html; then echo "Sin encuestas nuevas; ya actualizada hoy"; exit 0; fi
          fi
          # estimación del modelo con la media nueva (Nacho eligió la actualización automática el 22-10-2026); si
          # falla, se publica igual la página de encuestas con la estimación anterior
          if [[ $nuevas == 0 ]]; then
            echo "Sin encuestas nuevas: se rehace la página sin recalcular el modelo"
          elif SALIDAS=/tmp/salidas python3 previsiones/src/encuestas.py > /dev/null \
             && python3 previsiones/src/motor.py --encuestas /tmp/salidas/media-encuestas-$(date +%Y%m%d).json --publico; then
            git add previsiones/datos/publico
          else
            git checkout -- previsiones/datos/publico; echo "::warning::El modelo falló; se mantiene la estimación anterior"
          fi
          python3 encuestas/src/construir.py
          python3 src/iconos.py
          git add encuestas index.html generales-2026/src/plantilla.html img/compartir/encuestas.jpg img/movil
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Encuestas: actualización automática $(date -u +%F)$([[ $nuevas == 0 ]] && echo ' (sin encuestas nuevas)')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 10; done
          echo "publicado=1" >> "$GITHUB_OUTPUT"
      - name: Avisar a IndexNow
        if: steps.commit.outputs.publicado == '1'
        continue-on-error: true
        run: |
          sleep 120   # que GitHub Pages publique antes
          python3 src/indexnow.py encuestas/index.html
