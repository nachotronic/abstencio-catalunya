# Temporal, solo lectura: audiencia 23-11. No se fusiona a main.
name: Audiencia lunes 23-11
on:
  push:
    branches: [claude/project-thread-bkgxjl]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-lun23.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/lun23.py
