# Temporal, solo lectura: audiencia 17-11 a media jornada. No se fusiona a main.
name: Audiencia martes 17-11 c
on:
  push:
    branches: [claude/project-thread-mgo11y]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-mar17c.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/mar17c.py
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc17c.py
