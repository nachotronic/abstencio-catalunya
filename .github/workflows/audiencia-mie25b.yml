on:
  push:
    branches: [claude/project-thread-to7w6f]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-mie25b.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
