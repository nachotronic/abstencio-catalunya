# Temporal, solo lectura. No se fusiona a main.
name: SEO jueves 26-11
on:
  push:
    branches: [claude/project-thread-s6i9m7]
    paths: ['.github/audiencia/gsc26.py','.github/audiencia/trends26.py']
permissions:
  contents: read
jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python3 .github/audiencia/gsc26.py
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytrends
      - run: python3 .github/audiencia/trends26.py
