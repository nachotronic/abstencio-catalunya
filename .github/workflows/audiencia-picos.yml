# Temporal: lee Cloudflare (y Search Console si hay secretos) para analizar los picos del 2-3 nov. No se fusiona a main.
name: Audiencia picos
on:
  push:
    branches: [claude/audiencia-hoy]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-picos.yml']
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
        run: python3 .github/audiencia/picos.py
