# Temporal, solo lectura: audiencia 17-11 a media jornada. No se fusiona a main.
name: Audiencia martes 17-11 noche
on:
  push:
    branches: [claude/project-thread-26va3r]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-mar17d.yml']
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/mar17d.py
