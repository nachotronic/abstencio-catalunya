# Temporal: audiencia de la última semana desde Cloudflare. No se fusiona a main.
name: Audiencia semana
on:
  push:
    branches: [claude/project-thread-q2dwc5]
    paths: ['.github/audiencia/**','.github/workflows/audiencia-semana.yml']
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/audiencia/semana.py
