name: datos-evolucion
on:
  push:
    branches: [claude/datos-evolucion]
    paths: [fetch.sh, .github/workflows/d.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash fetch.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -m "Datos descargados" && git push
